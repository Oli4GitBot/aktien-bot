name: Investmenthypothesen-Alert

on:
  schedule:
    - cron: '0 8 * * 1-5'  # 10:00 Uhr MESZ (Sommerzeit) Mo-Fr
  workflow_dispatch:         # Manueller Start zum Testen

jobs:
  thesis-alert:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4.2.2

      - name: Python einrichten
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'

      - name: Abhängigkeiten installieren
        run: pip install requests yfinance pyyaml

      - name: Skript ausführen
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python thesis_alert_bot.py
