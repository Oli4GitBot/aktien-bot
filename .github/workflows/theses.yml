# Investmenthypothesen für das automatisierte Alerting (thesis_alert_bot.py).
#
# Quelle: von Claude aus "investments von claude/<TICKER>_Investmenthypothese.txt"
# übernommen (Snapshot, kein Live-Read). Bei aktualisierter These diese Datei
# von Hand anpassen oder Claude Bescheid geben, damit sie neu synchronisiert wird.
#
# Felder je Position:
#   name                  Anzeigename
#   stand                 Datum der zugrunde liegenden These
#   stop_loss             Schwelle, unter der ein Alert ausgelöst wird
#   take_profit           Liste von Kurszielen, ab denen ein Alert ausgelöst wird
#   review_interval_days  Turnus für die "Review fällig"-Erinnerung
#   last_review           Datum der letzten Prüfung (nach jeder Prüfung aktualisieren)
#   next_catalyst / next_catalyst_label   informativ, kein eigener Trigger
#   kill_kriterien        Liste, wird bei jedem Alert zur Einordnung mitgeschickt

ASML.AS:
  name: "ASML Holding"
  stand: "2026-08-15"
  stop_loss: 1405.85
  take_profit:
    - 1741
    - 2100
  review_interval_days: 14
  last_review: "2026-08-15"
  next_catalyst: "2026-10-14"
  next_catalyst_label: "Q3-Zahlen"
  kill_kriterien:
    - "China baut eigene DUV-Fertigung auf -> Marktanteilsverlust im Mature-Node-Segment (erste Meldungen 27.07.2026, im Auge behalten)"
    - "Eskalation von Exportkontrollen (US/NL)"
    - "Capex-Verdauung bei Großkunden nach der aktuellen KI-Investitionswelle"
    - "Bewertung bereits sportlich (KGV trailing ~62x, KUV ~17x) – wenig Puffer bei Wachstumsenttäuschung"
